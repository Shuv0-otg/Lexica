/* LEARN */
function lst(){let l=L.o==='az'?ALPHA:D;const q=L.q.trim().toLowerCase();

function learn(){const l=lst();if(L.i>=l.length)L.i=Math.max(0,l.length-1);const c=l[L.i];

 document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{L.k=b.dataset.k;L.i=0;learn()});document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{L.v=b.dataset.v;L.i=0;learn()});
 document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{L.let=L.let===b.dataset.l?'':b.dataset.l;L.i=0;learn()});
 if(c){S.last=1;S.pos=c.n;save()}}
function learnList(){const p=$('#sq').selectionStart;learn();const e=$('#sq');e.focus();e.setSelectionRange(p,p)}
function card(c,total){const ok=c.o[c.a],oth=c.o.filter((_,i)=>i!==c.a),title=c.h||c.q;
 const bare=!c.h||c.k==='Word'||/^[A-Za-z\-:\s]+$/.test(c.q.trim())&&c.q.trim().length<30;
 return `<div class="card"><div class="row"><span class="badge ${c.k}">${c.k==='Word'?'Word pair':c.k}</span><span class="no">Question no. ${c.n}</span><span class="sp"></span>
 <span class="row" style="flex-wrap:nowrap;gap:6px"><button class="ico ${has('fav',c.n)?'on':''}" onclick="tog('fav',${c.n});learn()" title="Save (S)" aria-label="Save">${ic('star')}</button><button class="ico ok ${has('known',c.n)?'on':''}" onclick="tog('known',${c.n});learn()" title="Mark as known (K)" aria-label="Known">${ic('chk',2.5)}</button></span></div>

 ${L.rec&&!L._s?`<div class="ans hid" onclick="L._s=1;learn()">${ic('eye')} Tap to reveal the answer</div>`:`<div class="ans"><small>${KL[c.k]}</small><b>${esc(ok)}</b></div>`}

 ${c.k!=='Bangla'?`<div class="bn"><label for="bn">বাংলা অর্থ – your Bangla meaning</label><input id="bn" class="t" style="width:100%" placeholder="Type or paste the Bangla meaning…" value="${esc(S.notes[c.n]||'')}" onchange="S.notes[${c.n}]=this.value;save();toast('Saved')">${c.h?`<a href="https://translate.google.com/?sl=en&tl=bn&text=${encodeURIComponent(c.h)}&op=translate" target="_blank" rel="noopener">Look up “${esc(c.h)}” in Bangla</a>`:''}</div>`:''}</div>
 <div class="pg"><button class="btn" onclick="step(-1)">‹ Prev</button><div class="bar"><i style="width:${(L.i+1)/total*100}%"></i></div><button class="btn p" onclick="step(1)">Next ›</button></div>
 <div class="row" style="margin-top:12px"><span class="mut">${(L.i+1).toLocaleString()} / ${total.toLocaleString()}</span><span class="sp"></span><button class="chip ${L.rec?'on':''}" onclick="L.rec=!L.rec;L._s=0;learn()">Recall mode</button><button class="chip" onclick="jump()">${ic('list')} Browse list</button></div>`}
function step(d){const n=lst().length;if(!n)return;L.i=(L.i+d+n)%n;L._s=0;learn()}
function jump(){const l=lst(),dg=$('#dg');dg.innerHTML=`<div class="h"><b>${l.length} items</b><span class="sp"></span><button class="ib" onclick="dg.close()" aria-label="Close">✕</button></div><div class="b">${l.slice(0,600).map((x,i)=>`<button class="li ${i===L.i?'on':''}" onclick="L.i=${i};L._s=0;dg.close();learn()"><b>${esc(x.h||x.q.slice(0,40))}</b><span>${esc(x.o[x.a])}</span></button>`).join('')}${l.length>600?'<p class="mut" style="padding:10px">Showing the first 600. Use search or letters to narrow down.</p>':''}</div>`;dg.showModal();const o=dg.querySelector('.on');o&&o.scrollIntoView({block:'center'})}

 const lc=Object.fromEntries(letters.map(x=>[x,0]));ALPHA.forEach(q=>lc[ltr(q)]++);
 A$(`<h2 class="s" style="margin-top:8px">Alphabetical test</h2><p class="mut" style="margin:0 0 10px">Questions are ordered A to Z by their headword. Pick a letter, a set size, then a set.</p>
 <div class="seg" role="group" aria-label="Set size">${[10,20,25,50].map(s=>`<button class="${A.size===s?'on':''}" data-s="${s}">${s} Q</button>`).join('')}</div>
 <div class="az">${letters.map(x=>`<button class="${A.let===x?'on':''}" data-l="${x}" ${lc[x]?'':'disabled'} title="${lc[x]} questions">${x}</button>`).join('')}</div>
 <div class="mut">${l.length.toLocaleString()} questions in ${ch.length} sets${A.let?' for “'+A.let+'”':''}</div>
 <div class="sets">${ch.map((c,i)=>{const k=`${A.let||'all'}:${A.size}:${i}`,b=S.done[k];return `<button class="set" data-i="${i}"><b>Set ${i+1}</b><span>${esc(c[0].h||c[0].q.slice(0,16))} → ${esc(c[c.length-1].h||c[c.length-1].q.slice(0,16))}</span><br><span>${c.length} questions</span> ${b!=null?`<em>Best ${b}%</em>`:''}</button>`}).join('')}</div>`);
 document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{A.size=+b.dataset.s;alpha()});document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{A.let=A.let===b.dataset.l?'':b.dataset.l;alpha()});
 document.querySelectorAll('.set').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;start(ch[i],`A–Z · Set ${i+1}${A.let?' ('+A.let+')':''}`,'alpha',`${A.let||'all'}:${A.size}:${i}`)})}
/* RANDOM */
const RP=()=>{let l=D.filter(q=>R.k.includes(q.k));if(R.p==='unk')l=l.filter(q=>!has('known',q.n));if(R.p==='fav')l=l.filter(q=>has('fav',q.n));if(R.p==='mist')l=l.filter(q=>has('mist',q.n));return l};
function random(){const p=RP().length;R.n=Math.max(1,Math.min(R.w,p||1));
 A$(`<h2 class="s" style="margin-top:8px">Random test</h2><p class="mut" style="margin:0 0 14px">Tell me how many questions you want. Each test is a fresh random draw.</p>
 <div class="card" style="margin-top:0"><b>Number of questions</b><div class="row" style="margin:10px 0"><div class="cnt"><button class="ico" id="mn" aria-label="Fewer">−</button><input type="number" id="nn" min="1" max="${p}" value="${R.n}" inputmode="numeric"><button class="ico" id="pl" aria-label="More">+</button></div>
 ${[10,20,30,50,100].map(n=>`<button class="chip ${R.n===n?'on':''}" data-n="${n}" ${n>p?'disabled':''}>${n}</button>`).join('')}<button class="chip ${R.n===p?'on':''}" data-n="${p}" ${p?'':'disabled'}>All ${p.toLocaleString()}</button></div>
 <b>Question types</b><div class="row" style="margin:10px 0">${['Synonym','Antonym','Word','Other','Bangla'].map(k=>`<button class="chip ${R.k.includes(k)?'on':''}" data-t="${k}">${k==='Word'?'Word pair':k}</button>`).join('')}</div>
 <b>Draw from</b><div class="row" style="margin:10px 0">${[['all','Everything'],['unk','Not yet known'],['fav','Saved'],['mist','My mistakes']].map(([k,t])=>`<button class="chip ${R.p===k?'on':''}" data-p="${k}">${t}</button>`).join('')}</div>
 <div class="row"><span class="mut">${p?p.toLocaleString()+' questions available':'No questions match. Pick at least one type or a different source.'}</span><span class="sp"></span><button class="btn p" id="go" ${p?'':'disabled'}>Start test</button></div></div>`);
 const nn=$('#nn');nn.onchange=()=>{R.w=Math.floor(+nn.value)||1;random()};$('#mn').onclick=()=>{R.w=R.n-1;random()};$('#pl').onclick=()=>{R.w=R.n+1;random()};
 document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{R.w=+b.dataset.n;random()});
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const k=b.dataset.t;R.k=R.k.includes(k)?R.k.filter(x=>x!==k):[...R.k,k];random()});
 document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{R.p=b.dataset.p;random()});
 $('#go').onclick=()=>{const c=Math.min(Math.max(1,Math.floor(+nn.value)||R.n),RP().length);R.w=R.n=c;start(shuf(RP()).slice(0,c),`Random · ${c} question${c>1?'s':''}`,'rand')}}
/* TEST ENGINE */
function start(list,title,mode,ck){if(!list.length)return;RF='all';T={list,title,mode,ck,i:0,a:[],t0:Date.now(),fin:false};quiz()}
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
function quiz(){const q=T.list[T.i],a=T.a[T.i],done=a!=null,n=T.list.length,LT='ABCDE';
 $('#nd').innerHTML=$('#nm').innerHTML='';
 A$(`<div class="row"><button class="btn" onclick="quit()">✕ Exit</button><b style="font-family:Newsreader,serif;font-size:19px">${esc(T.title)}</b><span class="sp"></span><span class="chip" id="tm">${fmt((Date.now()-T.t0)/1000|0)}</span></div>
 <div class="pg"><span class="mut">${T.i+1}/${n}</span><div class="bar"><i style="width:${(T.a.filter(x=>x!=null).length)/n*100}%"></i></div></div>
 <div class="card"><span class="badge ${q.k}">${q.k==='Word'?'Word pair':q.k}</span><div class="tq" style="margin-top:10px">${esc(q.q)}</div>${UL(q)}
 ${q.o.map((o,i)=>`<button class="opt ${done?(i===q.a?'ok':i===a?'no':''):''}" ${done?'disabled':''} data-i="${i}"><i>${LT[i]}</i><span>${esc(o)}</span></button>`).join('')}
 ${done?`<div class="fb ${a===q.a?'ok':'no'}">${a===q.a?'Correct!':'Not quite.'}<small>Answer: ${LT[q.a]}. ${esc(q.o[q.a])}${q.x?' · '+esc(q.x):''}</small></div>`:''}
 <div class="row"><button class="btn" ${T.i?'':'disabled'} onclick="tgo(-1)">‹ Prev</button><span class="sp"></span>${T.i<n-1?`<button class="btn ${done?'p':''}" onclick="tgo(1)">${done?'Next':'Skip'} ›</button>`:''}<button class="btn ${T.i===n-1&&done?'p':''}" onclick="finish()">Finish</button></div></div>
 <div class="nv">${T.list.map((x,i)=>`<button class="${T.a[i]!=null?(T.a[i]===x.a?'c':'w'):''} ${i===T.i?'cur':''}" onclick="T.i=${i};quiz()">${i+1}</button>`).join('')}</div>`);
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
 {const f=document.querySelector(done?'.btn.p':'.opt');f&&f.focus({preventScroll:true})}
 clearInterval(timer);timer=setInterval(()=>{const e=$('#tm');e?e.textContent=fmt((Date.now()-T.t0)/1000|0):clearInterval(timer)},1000)}
function pick(i){if(!T||T.fin||T.a[T.i]!=null)return;T.a[T.i]=i;quiz()}
function tgo(d){T.i=Math.max(0,Math.min(T.list.length-1,T.i+d));quiz()}
function quit(){if(!T.a.some(x=>x!=null)||confirm('Leave this test? Your answers will be lost.')){T=null;route()}}
function finish(){const un=T.list.length-T.a.filter(x=>x!=null).length;if(un&&!confirm(`${un} question${un>1?'s':''} unanswered. Finish anyway?`))return;
 T.fin=true;T.sec=(Date.now()-T.t0)/1000|0;T.s=T.list.filter((q,i)=>T.a[i]===q.a).length;const pc=Math.round(T.s/T.list.length*100);
 T.list.forEach((q,i)=>{if(T.a[i]==null)return;const m=S.mist.indexOf(q.n);if(T.a[i]===q.a){m>=0&&S.mist.splice(m,1)}else if(m<0)S.mist.push(q.n)});
 if(T.ck)S.done[T.ck]=Math.max(S.done[T.ck]||0,pc);S.hist.unshift({d:Date.now(),n:T.title,s:T.s,t:T.list.length,sec:T.sec});S.hist=S.hist.slice(0,40);save();route()}
let RF='all';
function results(){const n=T.list.length,pc=Math.round(T.s/n*100),wr=T.list.filter((q,i)=>T.a[i]!==q.a);
 $('#nd').innerHTML=$('#nm').innerHTML='';
 A$(`<div class="card" style="text-align:center"><h2 style="font-size:30px">${pc>=80?'Excellent work!':pc>=50?'Good effort!':'Keep practising!'}</h2><div class="row" style="justify-content:center;margin:18px 0"><div class="ring" style="--p:${pc}"><div>${pc}%</div></div></div>
 <p class="mut">${T.s} correct out of ${n} · ${wr.length} wrong or skipped · ${fmt(T.sec)}</p><div class="row" style="justify-content:center;margin-top:12px"><button class="btn p" ${wr.length?'':'disabled'} onclick="start(wr_(),'Retry wrong answers','mist')">Retry ${wr.length} missed</button><button class="btn" onclick="T=null;route()">Done</button></div></div>
 <div class="row" style="margin-top:18px"><h3 style="font-size:22px">Review</h3><span class="sp"></span>${[['all','All'],['w','Missed only']].map(([k,t])=>`<button class="chip ${RF===k?'on':''}" onclick="RF='${k}';results()">${t}</button>`).join('')}</div>
 ${T.list.map((q,i)=>({q,i})).filter(({q,i})=>RF==='all'||T.a[i]!==q.a).map(({q,i})=>`<div class="rv ${T.a[i]===q.a?'':'w'}"><b>${i+1}. ${esc(q.q)}</b><div class="mut">Correct: <b style="color:var(--ok)">${esc(q.o[q.a])}</b>${T.a[i]!==q.a?` · You chose: ${T.a[i]==null?'skipped':esc(q.o[T.a[i]])}`:''}</div></div>`).join('')}`);scrollTo(0,0)}
window.wr_=()=>T.list.filter((q,i)=>T.a[i]!==q.a);
/* PROGRESS */
function progress(){const kinds=['Synonym','Antonym','Word','Bangla','Other'];
 A$(`<h2 class="s" style="margin-top:8px">Progress</h2><div class="stats"><div class="stat"><b>${S.known.length}/${N}</b><span>known</span></div><div class="stat"><b>${S.fav.length}</b><span>saved</span></div><div class="stat"><b>${S.mist.length}</b><span>to review</span></div><div class="stat"><b>${S.hist.length}</b><span>tests taken</span></div></div>
 <div class="card"><b>By type</b>${kinds.map(k=>{const t=D.filter(q=>q.k===k),kn=t.filter(q=>has('known',q.n)).length;return `<div style="margin-top:12px"><div class="row"><span>${k==='Word'?'Word pair':k}</span><span class="sp"></span><span class="mut">${kn}/${t.length}</span></div><div class="bar"><i style="width:${t.length?kn/t.length*100:0}%"></i></div></div>`}).join('')}</div>
 <h3 style="font-size:22px;margin:22px 0 6px">Recent tests</h3>${S.hist.length?`<div class="card scr" style="margin-top:0"><table><tr><th>Date</th><th>Test</th><th>Score</th><th>Time</th></tr>${S.hist.map(h=>`<tr><td>${new Date(h.d).toLocaleDateString()}</td><td>${esc(h.n)}</td><td><b>${h.s}/${h.t}</b> (${Math.round(h.s/h.t*100)}%)</td><td>${fmt(h.sec)}</td></tr>`).join('')}</table></div>`:'<p class="mut">No tests yet. Take one and it will appear here.</p>'}
 <p style="margin-top:22px"><button class="btn" onclick="if(confirm('Reset all saved progress on this device?')){S={fav:[],known:[],mist:[],hist:[],done:{},notes:{},theme:S.theme,last:0};save();progress()}">Reset progress</button></p>`)}
/* KEYS */
addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.metaKey||e.ctrlKey||$('#dg').open)return;const k=e.key;if(/^(BUTTON|A)$/.test(e.target.tagName)&&(k==='Enter'||k===' '))return;
 if(T&&!T.fin){const i='abcde'.indexOf(k.toLowerCase());if(i>=0&&i<T.list[T.i].o.length)pick(i);else if(/^[1-5]$/.test(k)&&+k<=T.list[T.i].o.length)pick(+k-1);else if(k==='ArrowRight'||k==='Enter')tgo(1);else if(k==='ArrowLeft')tgo(-1);return}
 if((location.hash||'#home')==='#learn'&&!T){const c=lst()[L.i];if(k==='ArrowRight')step(1);else if(k==='ArrowLeft')step(-1);else if(k===' '){e.preventDefault();L._s=1;learn()}else if(c&&k==='s'){tog('fav',c.n);learn()}else if(c&&k==='k'){tog('known',c.n);learn()}}});
theme();route();
